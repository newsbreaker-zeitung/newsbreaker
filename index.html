<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schüler*Innen-Zeitung NEWSBREAKER</title>
    <style>
        :root {
            --primary-black: #000000;
            --primary-white: #ffffff;
            --bg-gray: #f4f4f4;
            --header-font: 'Klein', sans-serif;
            --body-font: 'Cocomat Pro', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--body-font);
            background-color: var(--primary-white);
            color: var(--primary-black);
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid var(--primary-black);
            margin-bottom: 50px;
        }

        .logo-small {
            max-width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-family: var(--header-font);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .archive-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .issue-card {
            border: 5px solid var(--primary-black);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .issue-card:hover {
            transform: translateY(-5px);
            box-shadow: 10px 10px 0px var(--primary-black);
        }

        .issue-preview {
            width: 100%;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .issue-info h2 {
            font-family: var(--header-font);
            font-size: 1.5rem;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary-black);
            display: inline-block;
        }

        .issue-info p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .download-btn {
            background-color: var(--primary-black);
            color: var(--primary-white);
            text-decoration: none;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
            transition: 0.3s;
        }

        .download-btn:hover {
            background-color: #333;
        }

        footer {
            margin-top: 100px;
            text-align: center;
            padding: 40px;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .issue-card { border-width: 3px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://github.com/newsbreaker-zeitung/newsbreaker/blob/main/dateien/newsbreaker-logo.png?raw=true" alt="NEWSBREAKER Logo" class="logo-small">
        <h1>Unsere Ausgaben</h1>
    </header>

    <!-- Hier werden die Ausgaben automatisch reingeladen -->
    <main class="archive-container" id="zeitungs-archiv">
        <p style="text-align: center;">Ausgaben werden geladen...</p>
    </main>

        <footer class="site-footer">
    <div class="footer-content">
        <a href="https://newsbreaker-zeitung.github.io/newsbreaker/admin/" class="login-link">Interner Login</a>
         <p>NEWSBREAKER - Schüler*innen-Zeitung der LVR-Luise-Leven-Schule Krefeld</p>
<p style="margin-top: 10px; font-size: 0.8rem; color: #666;">Website erstellt von Thomas (Mitglied der NEWSBREAKER von 2023 bis 2026)</p>
<p style="margin-top: 10px; font-size: 0.8rem; color: #666;">Version 1.0.1</p>
    </div>
</footer>

    <!-- Das Skript, das die ausgaben.json ausliest -->
    <script>
        fetch('ausgaben.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('zeitungs-archiv');
                container.innerHTML = ''; // "Wird geladen..." entfernen

                // Falls noch keine Ausgaben da sind
                if (!data.ausgaben_liste || data.ausgaben_liste.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">Aktuell sind keine Ausgaben online.</p>';
                    return;
                }

                // Jede Ausgabe aus der JSON-Datei auf der Seite anzeigen
                data.ausgaben_liste.forEach(ausgabe => {
                    container.innerHTML += `
                        <article class="issue-card">
                            <img src="${ausgabe.cover || 'https://via.placeholder.com/400x560/ffffff/000000?text=VORSCHAU'}" alt="${ausgabe.titel} Cover" class="issue-preview">
                            <div class="issue-info">
                                <h2>${ausgabe.titel}</h2>
                                <p>${ausgabe.beschreibung}</p>
                                <a href="${ausgabe.pdf}" download class="download-btn">PDF Herunterladen</a>
                            </div>
                        </article>
                    `;
                });
            })
            .catch(err => {
                console.error("Fehler beim Laden der Ausgaben:", err);
                document.getElementById('zeitungs-archiv').innerHTML = '<p style="text-align: center; color: red;">Fehler beim Laden der Ausgaben.</p>';
            });
    </script>

</body>
</html>
